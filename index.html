<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose 🌹</title>

<style>
html, body {
  height: 100%;
  padding: 0;
  margin: 0;
  background-color: black;
  overflow: hidden;
}
canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
}
#glow {
  filter: blur(12px);
  opacity: 0.8;
  mix-blend-mode: screen;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="rose"></canvas>
<canvas id="glow"></canvas>
<script>
/*
 * Settings
 */
var settings = {
  spin:      1.55, // rotation speed in rad/sec (one turn ~4 sec)
  lean:      0.24, // how far the stem sways, in rad
  camera:    7,    // camera distance
  petals:    38,   // number of petals in the bloom
  bloom:     0.82, // bloom scale
  bloomY:    0.78, // height of the bloom base on the stem
  ringY:    -0.50, // height of the thorn ring centre
  ringR:     0.98, // thorn ring radius
  ringTilt:  1.05, // thorn ring tilt in rad
};

var canvas = document.getElementById("rose"),
    ctx    = canvas.getContext("2d"),
    glow   = document.getElementById("glow"),
    gctx   = glow.getContext("2d");
var W, H, unit;

function onResize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = Math.floor(window.innerWidth  * dpr);
  H = canvas.height = Math.floor(window.innerHeight * dpr);
  glow.width  = Math.ceil(W / 2);
  glow.height = Math.ceil(H / 2);
  unit = Math.min(H / 3.9, W / 3.0);
}
window.onresize = onResize;

/*
 * Materials
 */
var petalMat  = { lit: [255, 236, 238], dark: [190, 98, 126], spec: 130 };
var leafMat   = { lit: [255, 205, 212], dark: [128, 56, 84],  spec: 150 };
var sepalMat  = { lit: [255, 190, 200], dark: [120, 50, 78],  spec: 90 };
var STEM_COL  = "rgb(255,214,220)";
var RING_COL  = "rgb(255,196,206)";

/*
 * Static geometry (model space, y is up)
 */
var V = [];      // vertices x,y,z
var Q = [];      // quads
var S = [];      // line segments

function vert(x, y, z) {
  V.push(x, y, z);
  return V.length / 3 - 1;
}

// build a (u,v) surface, u in [-1,1], v in [0,1]
function surface(nu, nv, fn, mat, shadeV) {
  var base = V.length / 3, i, j;
  for (j = 0; j <= nv; j++)
    for (i = 0; i <= nu; i++) {
      var p = fn(i / nu * 2 - 1, j / nv);
      vert(p[0], p[1], p[2]);
    }
  for (j = 0; j < nv; j++)
    for (i = 0; i < nu; i++) {
      var a = base + j * (nu + 1) + i;
      Q.push({
        a: a, b: a + 1, c: a + nu + 2, d: a + nu + 1,
        mat: mat,
        k: shadeV ? shadeV((j + 0.5) / nv) : 1,
        z: 0, col: ""
      });
    }
}

function stemAt(y) {
  var d = y - settings.bloomY;
  return [0.10 * Math.sin(d * 1.1), y, 0.05 * Math.sin(d * 2.1)];
}

// the bloom: petals spiralling out by the golden angle
(function() {
  var N = settings.petals, BS = settings.bloom, BY = settings.bloomY;
  for (var n = 0; n < N; n++) (function(i) {
    var t    = i / (N - 1),
        phi  = i * 2.39996,
        r0   = 0.02 + 0.20 * Math.pow(t, 1.2),
        a0   = -0.18 + 0.66 * Math.pow(t, 1.6),
        len  = 0.46 + 0.20 * t,
        wrap = 1.5 - 0.7 * t,
        curl = 0.75 * t * t * t,
        y0   = -0.20 * t;
    surface(6, 6, function(u, v) {
      var th  = a0 + curl * v * v * 0.5;
      var rad = r0 + len * v * Math.sin(th)
              + 0.10 * len * Math.sin(Math.PI * v) * (1 - 0.5 * t)
              + 0.035 * Math.sin(u * 5 + i) * v * t;
      var hgt = y0 + len * v * Math.cos(th) - u * u * 0.22 * len * v
              + 0.02 * Math.sin(u * 7 + i * 1.7) * v;
      var ang = phi + u * wrap * (0.25 + 0.75 * Math.sin(Math.PI / 2 * Math.min(1, v * 1.5)));
      return [BS * rad * Math.cos(ang), BY + BS * hgt, BS * rad * Math.sin(ang)];
    }, petalMat, function(v) { return 0.28 + 0.72 * v; });
  })(n);
})();

// a pointed, folded leaf growing out of the stem
function leaf(y, phi, len, wid, elev, mat) {
  var o = stemAt(y), c = Math.cos(phi), s = Math.sin(phi);
  surface(4, 6, function(u, v) {
    var w    = wid * Math.pow(Math.sin(Math.PI * (0.04 + 0.96 * v)), 0.8) * (1 - 0.35 * v);
    var out  = len * v * Math.cos(elev);
    var up   = len * v * Math.sin(elev) - 0.25 * len * v * v + Math.abs(u) * w * 0.45;
    var side = u * w;
    return [o[0] + out * c - side * s, o[1] + up, o[2] + out * s + side * c];
  }, mat, function(v) { return 0.6 + 0.4 * v; });
}

(function() {
  var i;
  // sepals under the bloom
  for (i = 0; i < 5; i++)
    leaf(settings.bloomY - 0.03, i * 1.2566 + 0.3, 0.20, 0.055, -0.35, sepalMat);
  // leaves
  leaf( 0.28, 4.6, 0.36, 0.10, 0.60, leafMat);
  leaf( 0.02, 0.6, 0.56, 0.16, 0.50, leafMat);
  leaf(-0.22, 2.6, 0.40, 0.12, 0.55, leafMat);
  leaf(-0.42, 3.6, 0.60, 0.17, 0.45, leafMat);
  leaf(-0.70, 5.6, 0.42, 0.12, 0.50, leafMat);
  leaf(-0.88, 1.7, 0.46, 0.13, 0.55, leafMat);

  // stem
  var top = settings.bloomY, bottom = -1.85, n = 40, prev = null;
  for (i = 0; i <= n; i++) {
    var p = stemAt(top + (bottom - top) * i / n);
    var id = vert(p[0], p[1], p[2]);
    if (prev !== null)
      S.push({ a: prev, b: id, w: 0.05 * (1 - 0.5 * i / n), col: STEM_COL });
    prev = id;
  }
  // thorns
  var ys = [0.45, 0.15, -0.12, -0.55, -0.95, -1.2, -1.45];
  for (i = 0; i < ys.length; i++) {
    var o = stemAt(ys[i]), a = i * 2.2 + 0.5;
    S.push({
      a: vert(o[0], o[1], o[2]),
      b: vert(o[0] + 0.09 * Math.cos(a), o[1] + 0.05, o[2] + 0.09 * Math.sin(a)),
      w: 0.022, col: STEM_COL
    });
  }
})();

// little iridescent tags stuck around the rose
var tags = [
  { p: [ 0.20,  1.08,  0.30], a: 0.4, w: 0.04, h: 0.10, col: "rgba(126,96,255,0.9)" },
  { p: [-0.62, -0.72,  0.55], a: 2.1, w: 0.04, h: 0.08, col: "rgba(236,232,110,0.9)" },
  { p: [ 0.80, -0.30, -0.45], a: 4.0, w: 0.035, h: 0.08, col: "rgba(120,230,225,0.9)" },
  { p: [ 0.10, -1.15,  0.12], a: 1.2, w: 0.045, h: 0.09, col: "rgba(255,90,160,0.9)" },
];

var sparkles = [
  [-1.25, -0.15,  0.20], [-1.12, -0.42, -0.30], [ 1.28, -0.25,  0.10],
  [ 1.15, -0.55, -0.40], [ 0.20, -0.35,  1.20], [-0.30, -0.60, -1.20],
  [ 0.95,  0.30,  0.70], [-0.90,  0.40, -0.70],
];

var butterflies = [
  { phase: 0.0, r: 0.98, y: 0.95, speed: 0.35, size: 1.0,  col: "255,176,206" },
  { phase: 2.7, r: 0.86, y: 0.50, speed: 0.50, size: 0.85, col: "232,222,128" },
  { phase: 4.6, r: 1.02, y: -0.9, speed: 0.30, size: 0.75, col: "255,190,214" },
];

/*
 * Rendering
 */
var T = null;        // vertices in camera space
var P = null;        // vertices on screen
var list = [];       // everything that gets drawn this frame
var cy, sy, cz, sz, cx, sx;

// model space -> camera space
function toCamera(x, y, z, out, o) {
  var x1 =  x * cy + z * sy, z1 = -x * sy + z * cy;
  var x2 = x1 * cz - y * sz, y2 = x1 * sz + y * cz;
  out[o]     = x2;
  out[o + 1] = y2 * cx - z1 * sx + 0.32;
  out[o + 2] = y2 * sx + z1 * cx;
}

// camera space -> screen, returns perspective scale
function project(src, o, dst, d) {
  var s = settings.camera / (settings.camera - src[o + 2]) * unit;
  dst[d]     = W / 2 + src[o] * s;
  dst[d + 1] = H / 2 - src[o + 1] * s;
  return s;
}

var tmp = [0, 0, 0], scr = [0, 0];
function point(x, y, z) {
  toCamera(x, y, z, tmp, 0);
  var s = project(tmp, 0, scr, 0);
  return { x: scr[0], y: scr[1], z: tmp[2], s: s };
}

function shade(q) {
  var a = q.a * 3, b = q.b * 3, c = q.c * 3, d = q.d * 3;
  var ux = T[c] - T[a], uy = T[c + 1] - T[a + 1], uz = T[c + 2] - T[a + 2];
  var vx = T[d] - T[b], vy = T[d + 1] - T[b + 1], vz = T[d + 2] - T[b + 2];
  var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
  var l = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
  nx /= l; ny /= l; nz /= l;
  if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }

  var diff = Math.abs(-0.42 * nx + 0.52 * ny + 0.74 * nz);
  var spec = Math.pow(Math.abs(-0.2 * nx + 0.3 * ny + 0.93 * nz), 26);
  var i = Math.min(1, (0.22 + 0.86 * diff) * q.k);
  var m = q.mat, sp = spec * m.spec;
  // slight iridescent tint depending on where the surface faces
  var r = m.dark[0] + (m.lit[0] - m.dark[0]) * i + sp + ny * 10;
  var g = m.dark[1] + (m.lit[1] - m.dark[1]) * i + sp - nx * 8;
  var bl = m.dark[2] + (m.lit[2] - m.dark[2]) * i + sp + nx * 26;
  q.col = "rgb(" + (r > 255 ? 255 : r | 0) + "," + (g > 255 ? 255 : g < 0 ? 0 : g | 0) + "," + (bl > 255 ? 255 : bl | 0) + ")";
  q.z = (T[a + 2] + T[b + 2] + T[c + 2] + T[d + 2]) / 4;
}

function drawQuad(q) {
  var a = q.a * 2, b = q.b * 2, c = q.c * 2, d = q.d * 2;
  ctx.fillStyle = ctx.strokeStyle = q.col;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(P[a], P[a + 1]);
  ctx.lineTo(P[b], P[b + 1]);
  ctx.lineTo(P[c], P[c + 1]);
  ctx.lineTo(P[d], P[d + 1]);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawLine(o) {
  ctx.strokeStyle = o.col;
  ctx.lineWidth = o.w;
  ctx.beginPath();
  ctx.moveTo(o.x1, o.y1);
  ctx.lineTo(o.x2, o.y2);
  ctx.stroke();
}

function drawPoly(o) {
  var p = o.pts;
  ctx.fillStyle = o.col;
  ctx.beginPath();
  ctx.moveTo(p[0].x, p[0].y);
  for (var i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
  ctx.closePath();
  ctx.fill();
  if (o.edge) {
    ctx.strokeStyle = o.edge;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

// four-pointed sparkle
function drawSparkle(o) {
  var r = o.r, q = r * 0.12;
  ctx.fillStyle = "rgba(255,226,232," + o.alpha + ")";
  ctx.beginPath();
  ctx.moveTo(o.x, o.y - r);
  ctx.quadraticCurveTo(o.x + q, o.y - q, o.x + r * 0.6, o.y);
  ctx.quadraticCurveTo(o.x + q, o.y + q, o.x, o.y + r);
  ctx.quadraticCurveTo(o.x - q, o.y + q, o.x - r * 0.6, o.y);
  ctx.quadraticCurveTo(o.x - q, o.y - q, o.x, o.y - r);
  ctx.fill();
}

function line(p, q, w, col) {
  list.push({ draw: drawLine, z: (p.z + q.z) / 2, x1: p.x, y1: p.y, x2: q.x, y2: q.y,
              w: Math.max(1, w * (p.s + q.s) / 2), col: col });
}

// thorn ring circling the stem
function addRing() {
  var N = 150, R = settings.ringR, ct = Math.cos(settings.ringTilt), st = Math.sin(settings.ringTilt);
  var o = stemAt(settings.ringY), prev = null, first = null;
  function at(a, r, lift) {
    var x = r * Math.cos(a), y = lift, z = r * Math.sin(a);
    return point(o[0] + x, o[1] + y * ct - z * st, o[2] + y * st + z * ct);
  }
  for (var i = 0; i < N; i++) {
    var a = i / N * Math.PI * 2;
    var r = R + 0.022 * Math.sin(a * 9) + 0.012 * Math.sin(a * 23);
    var lift = 0.03 * Math.sin(a * 6);
    var p = at(a, r, lift);
    if (prev) line(prev, p, 0.03, RING_COL); else first = p;
    prev = p;
    if (i % 10 == 0) {   // barbs
      var k = (i / 10) % 2 ? 1 : -1;
      line(at(a - 0.02, r - 0.05, lift - 0.035 * k), at(a + 0.02, r + 0.05, lift + 0.035 * k), 0.016, RING_COL);
      line(at(a, r, lift - 0.045), at(a, r, lift + 0.045), 0.016, RING_COL);
    }
  }
  line(prev, first, 0.03, RING_COL);
}

function addButterfly(b, t) {
  var a = b.phase + t * b.speed, sz = 0.2 * b.size;
  var px = b.r * Math.cos(a), py = b.y + 0.08 * Math.sin(t * 1.7 + b.phase), pz = b.r * Math.sin(a);
  var fx = -Math.sin(a), fz = Math.cos(a);     // heading
  var rx =  Math.cos(a), rz = Math.sin(a);     // sideways
  var flap = 0.15 + 1.0 * Math.abs(Math.sin(t * 8 + b.phase));
  var cf = Math.cos(flap), sf = Math.sin(flap);
  var wings = [
    [[0, 0], [0.55, 0.25], [0.75, 0.90], [0.20, 1.00], [-0.10, 0.45]],   // fore wing
    [[0, 0], [-0.10, 0.50], [-0.50, 0.70], [-0.60, 0.25]],               // hind wing
  ];
  for (var side = -1; side <= 1; side += 2)
    for (var w = 0; w < wings.length; w++) {
      var pts = [], z = 0;
      for (var i = 0; i < wings[w].length; i++) {
        var f = wings[w][i][0] * sz, l = wings[w][i][1] * sz;
        var q = point(px + fx * f + rx * side * l * cf, py + l * sf, pz + fz * f + rz * side * l * cf);
        pts.push(q); z += q.z;
      }
      list.push({ draw: drawPoly, z: z / pts.length, pts: pts,
                  col: "rgba(" + b.col + "," + (w ? 0.7 : 0.85) + ")", edge: "rgba(255,240,244,0.9)" });
    }
  line(point(px - fx * sz * 0.35, py, pz - fz * sz * 0.35),
       point(px + fx * sz * 0.45, py, pz + fz * sz * 0.45), 0.014, "rgb(255,235,240)");
}

function addTag(g) {
  var c = Math.cos(g.a), s = Math.sin(g.a), x = g.p[0], y = g.p[1], z = g.p[2];
  var pts = [
    point(x - g.w * c, y - g.h * 0.9 + g.w * 0.3, z - g.w * s),
    point(x + g.w * c, y - g.h * 0.9 - g.w * 0.3, z + g.w * s),
    point(x + g.w * c, y + g.h * 0.9 - g.w * 0.3, z + g.w * s),
    point(x - g.w * c, y + g.h * 0.9 + g.w * 0.3, z - g.w * s),
  ];
  list.push({ draw: drawPoly, z: (pts[0].z + pts[2].z) / 2, pts: pts, col: g.col, edge: "rgba(255,255,255,0.8)" });
}

var start = null;
function render(now) {
  requestAnimationFrame(render);
  if (start === null) start = now;
  var t = (now - start) / 1000, i;

  // the rose spins on its stem while the stem sways
  var spin = t * settings.spin,
      lz   = settings.lean * Math.sin(t * 0.8),
      lx   = 0.20 + 0.10 * Math.cos(t * 0.6);
  cy = Math.cos(spin); sy = Math.sin(spin);
  cz = Math.cos(lz);   sz = Math.sin(lz);
  cx = Math.cos(lx);   sx = Math.sin(lx);

  var n = V.length / 3;
  if (!T) { T = new Float32Array(n * 3); P = new Float32Array(n * 2); }
  var scale = new Float32Array(n);
  for (i = 0; i < n; i++) {
    toCamera(V[i * 3], V[i * 3 + 1], V[i * 3 + 2], T, i * 3);
    scale[i] = project(T, i * 3, P, i * 2);
  }

  list.length = 0;
  for (i = 0; i < Q.length; i++) {
    shade(Q[i]);
    Q[i].draw = drawQuad;
    list.push(Q[i]);
  }
  for (i = 0; i < S.length; i++) {
    var s = S[i];
    list.push({ draw: drawLine, z: (T[s.a * 3 + 2] + T[s.b * 3 + 2]) / 2,
                x1: P[s.a * 2], y1: P[s.a * 2 + 1], x2: P[s.b * 2], y2: P[s.b * 2 + 1],
                w: Math.max(1.5, s.w * (scale[s.a] + scale[s.b]) / 2), col: s.col });
  }
  addRing();
  for (i = 0; i < butterflies.length; i++) addButterfly(butterflies[i], t);
  for (i = 0; i < tags.length; i++) addTag(tags[i]);
  for (i = 0; i < sparkles.length; i++) {
    var p = point(sparkles[i][0], sparkles[i][1], sparkles[i][2]);
    var tw = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.9);
    list.push({ draw: drawSparkle, z: p.z, x: p.x, y: p.y,
                r: (0.07 + 0.07 * tw) * p.s, alpha: 0.55 + 0.45 * tw });
  }

  // painter's algorithm: far to near
  list.sort(function(a, b) { return a.z - b.z; });

  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = "round";
  for (i = 0; i < list.length; i++) list[i].draw(list[i]);

  // blurred copy on top gives the glow
  gctx.clearRect(0, 0, glow.width, glow.height);
  gctx.drawImage(canvas, 0, 0, glow.width, glow.height);
}

onResize();
requestAnimationFrame(render);
</script>

</body>
</html>
